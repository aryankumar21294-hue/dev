<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Happy New Year 2026 - Dev</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@700&family=Montserrat:wght@300;400;600&family=Sacramento&display=swap" rel="stylesheet">
    
    <style>
        body {
            background-color: #000;
            margin: 0;
            overflow: hidden;
            font-family: 'Montserrat', sans-serif;
            color: white;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        #canvas-bg {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
        }

        /* Glass Card */
        .glass-card {
            position: relative;
            z-index: 10;
            width: 85%;
            max-width: 380px;
            background: rgba(15, 15, 25, 0.65);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-top: 1px solid rgba(255, 215, 0, 0.5);
            border-bottom: 1px solid rgba(255, 0, 255, 0.5);
            box-shadow: 0 0 50px rgba(0, 0, 0, 0.8);
            border-radius: 24px;
            padding: 2rem 1.5rem;
            text-align: center;
            animation: float 6s ease-in-out infinite;
        }

        /* 3D Float Animation */
        @keyframes float {
            0%, 100% { transform: translateY(0px); }
            50% { transform: translateY(-15px); }
        }

        .date-badge {
            background: linear-gradient(90deg, #FFD700, #ff8c00);
            color: #000;
            padding: 5px 15px;
            border-radius: 50px;
            font-size: 0.7rem;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 15px;
            display: inline-block;
            box-shadow: 0 0 15px rgba(255, 215, 0, 0.6);
        }

        h1.main-title {
            font-family: 'Cinzel', serif;
            font-size: 2.5rem;
            line-height: 1;
            margin-bottom: 5px;
            background: linear-gradient(to right, #fff, #a1a1aa);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            filter: drop-shadow(0 0 10px rgba(255,255,255,0.3));
        }

        .year-glitch {
            font-family: 'Cinzel', serif;
            font-size: 4.5rem;
            font-weight: 900;
            line-height: 1;
            margin-bottom: 10px;
            color: white;
            text-shadow: 2px 2px 0px #FF00FF, -2px -2px 0px #00FFFF;
            animation: glitch-anim 2s infinite alternate-reverse;
        }

        @keyframes glitch-anim {
            0% { text-shadow: 2px 2px 0px #FF00FF, -2px -2px 0px #00FFFF; }
            100% { text-shadow: -2px 2px 0px #FF00FF, 2px -2px 0px #00FFFF; }
        }

        .message {
            font-size: 0.9rem;
            line-height: 1.6;
            color: #d1d5db;
            margin: 20px 0;
            border-top: 1px solid rgba(255,255,255,0.1);
            border-bottom: 1px solid rgba(255,255,255,0.1);
            padding: 15px 0;
        }

        .signature {
            font-family: 'Sacramento', cursive;
            font-size: 2.2rem;
            color: #FFD700;
            margin-top: 5px;
            text-shadow: 0 0 10px rgba(255, 215, 0, 0.4);
        }

        /* Buttons */
        .btn {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            width: 100%;
            padding: 14px;
            border-radius: 12px;
            font-weight: 600;
            text-decoration: none;
            transition: 0.3s;
            margin-bottom: 10px;
            font-size: 0.9rem;
            position: relative;
            overflow: hidden;
        }

        /* Shine effect on button */
        .btn::after {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.2), transparent);
            transition: 0.5s;
        }
        .btn:hover::after {
            left: 100%;
        }

        .btn-insta {
            background: linear-gradient(45deg, #833ab4, #fd1d1d, #fcb045);
            color: white;
            box-shadow: 0 5px 15px rgba(253, 29, 29, 0.3);
        }

        .btn-whatsapp {
            background: linear-gradient(90deg, #25D366, #128C7E);
            color: white;
            box-shadow: 0 5px 15px rgba(37, 211, 102, 0.3);
        }
    </style>
</head>
<body>

    <canvas id="canvas-bg"></canvas>

    <div class="glass-card">
        <div class="date-badge">January 1st, 2026</div>

        <h1 class="main-title">HAPPY NEW YEAR</h1>
        <div class="year-glitch">2026</div>

        <div class="message">
            <p>"Wishing you all a very Happy New Year from me and my family. ✨"</p>
            <br>
            <p>May this year bring you closer to your dreams and fill your life with magic.</p>
        </div>

        <div class="mb-6">
            <p class="text-[10px] text-gray-400 uppercase tracking-[0.2em]">Best Wishes From</p>
            <div class="signature">dev</div>
            <p class="text-xs text-cyan-400 font-bold tracking-wider">(Dev Raj)</p>
        </div>

        <div>
            <a href="https://www.instagram.com/devraj_0905?igsh=ZmtjOWF0anp0MXVy" target="_blank" class="btn btn-insta">
                <i class="fa-brands fa-instagram text-xl"></i> Connect on Instagram
            </a>
            
            <a href="https://wa.me/918603695049?text=Happy%20New%20Year%20Dev!%20%F0%9F%8E%89%20Wishing%20you%20a%20great%20year%20ahead." target="_blank" class="btn btn-whatsapp">
                <i class="fa-brands fa-whatsapp text-xl"></i> Send Me a Wish
            </a>
        </div>
    </div>

    <script>
        // --- ULTIMATE ANIMATION ENGINE ---
        const canvas = document.getElementById('canvas-bg');
        const ctx = canvas.getContext('2d');
        let w, h;
        
        function resize() {
            w = canvas.width = window.innerWidth;
            h = canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resize);
        resize();

        // 1. WARP SPEED STARS (Multiverse Theme)
        const stars = [];
        const STAR_COUNT = 150;
        
        class Star {
            constructor() {
                this.x = (Math.random() - 0.5) * w;
                this.y = (Math.random() - 0.5) * h;
                this.z = Math.random() * w; // Depth
            }
            update() {
                this.z -= 5; // Speed
                if(this.z <= 0) {
                    this.z = w;
                    this.x = (Math.random() - 0.5) * w;
                    this.y = (Math.random() - 0.5) * h;
                }
            }
            draw() {
                let sx = (this.x / this.z) * w + w/2;
                let sy = (this.y / this.z) * h + h/2;
                let r = (1 - this.z/w) * 2.5;
                
                ctx.beginPath();
                ctx.fillStyle = "white";
                ctx.arc(sx, sy, r, 0, Math.PI * 2);
                ctx.fill();
            }
        }
        for(let i=0; i<STAR_COUNT; i++) stars.push(new Star());

        // 2. REALISTIC FIREWORKS SYSTEM
        const fireworks = [];
        const particles = [];

        class Firework {
            constructor(sx, sy, tx, ty) {
                this.x = sx;
                this.y = sy;
                this.sx = sx;
                this.sy = sy;
                this.tx = tx;
                this.ty = ty;
                this.distanceToTarget = Math.sqrt(Math.pow(tx - sx, 2) + Math.pow(ty - sy, 2));
                this.distanceTraveled = 0;
                this.coordinates = [];
                this.coordinateCount = 3;
                while(this.coordinateCount--) {
                    this.coordinates.push([this.x, this.y]);
                }
                this.angle = Math.atan2(ty - sy, tx - sx);
                this.speed = 2;
                this.acceleration = 1.05;
                this.brightness = Math.random() * 50 + 50;
                this.targetRadius = 1;
                this.hue = Math.floor(Math.random() * 360);
            }
            
            update(index) {
                this.coordinates.pop();
                this.coordinates.unshift([this.x, this.y]);
                this.speed *= this.acceleration;
                
                let vx = Math.cos(this.angle) * this.speed;
                let vy = Math.sin(this.angle) * this.speed;
                
                this.distanceTraveled = Math.sqrt(Math.pow(this.x - this.sx, 2) + Math.pow(this.y - this.sy, 2));
                
                if(this.distanceTraveled >= this.distanceToTarget) {
                    createParticles(this.tx, this.ty, this.hue);
                    fireworks.splice(index, 1);
                } else {
                    this.x += vx;
                    this.y += vy;
                }
            }

            draw() {
                ctx.beginPath();
                ctx.moveTo(this.coordinates[this.coordinates.length - 1][0], this.coordinates[this.coordinates.length - 1][1]);
                ctx.lineTo(this.x, this.y);
                ctx.strokeStyle = 'hsl(' + this.hue + ', 100%, 50%)';
                ctx.stroke();
            }
        }

        class Particle {
            constructor(x, y, hue) {
                this.x = x;
                this.y = y;
                this.coordinates = [];
                this.coordinateCount = 5;
                while(this.coordinateCount--) {
                    this.coordinates.push([this.x, this.y]);
                }
                this.angle = Math.random() * Math.PI * 2;
                this.speed = Math.random() * 10 + 1;
                this.friction = 0.95;
                this.gravity = 1;
                this.hue = Math.random() * 20 + hue;
                this.brightness = Math.random() * 80 + 50;
                this.alpha = 1;
                this.decay = Math.random() * 0.03 + 0.015;
            }

            update(index) {
                this.coordinates.pop();
                this.coordinates.unshift([this.x, this.y]);
                this.speed *= this.friction;
                this.x += Math.cos(this.angle) * this.speed;
                this.y += Math.sin(this.angle) * this.speed + this.gravity;
                this.alpha -= this.decay;
                
                if(this.alpha <= this.decay) {
                    particles.splice(index, 1);
                }
            }

            draw() {
                ctx.beginPath();
                ctx.moveTo(this.coordinates[this.coordinates.length - 1][0], this.coordinates[this.coordinates.length - 1][1]);
                ctx.lineTo(this.x, this.y);
                ctx.strokeStyle = 'hsla(' + this.hue + ', 100%, ' + this.brightness + '%, ' + this.alpha + ')';
                ctx.stroke();
            }
        }

        function createParticles(x, y, hue) {
            let particleCount = 50;
            while(particleCount--) {
                particles.push(new Particle(x, y, hue));
            }
        }

        // --- ANIMATION LOOP ---
        function loop() {
            requestAnimationFrame(loop);
            
            // Trail effect (Motion blur)
            ctx.globalCompositeOperation = 'destination-out';
            ctx.fillStyle = 'rgba(0, 0, 0, 0.3)'; // Adjust for trail length
            ctx.fillRect(0, 0, w, h);
            ctx.globalCompositeOperation = 'lighter';

            // 1. Draw Stars
            stars.forEach(star => {
                star.update();
                star.draw();
            });

            // 2. Launch Fireworks (Randomly)
            if(Math.random() < 0.08) { // Frequency of rockets
                let sx = Math.random() * w; // Start X
                let sy = h; // Start Y (Bottom)
                let tx = Math.random() * w; // Target X
                let ty = Math.random() * (h/2); // Target Y (Top half)
                fireworks.push(new Firework(sx, sy, tx, ty));
            }

            // 3. Update/Draw Fireworks
            let i = fireworks.length;
            while(i--) {
                fireworks[i].draw();
                fireworks[i].update(i);
            }

            // 4. Update/Draw Particles
            let j = particles.length;
            while(j--) {
                particles[j].draw();
                particles[j].update(j);
            }
        }

        loop();
    </script>
</body>
</html>
